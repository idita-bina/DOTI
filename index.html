<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>הצ'אט שלי</title>
  <style>
    /* =========================================
       אזור העיצוב שלך - כאן משנים צבעים בקלות
       ========================================= */
    :root {
      --primary-color: #4f46e5;       /* צבע ראשי (כותרת, כפתור ובועות משתמש) */
      --bg-color: #f4f6fb;            /* צבע רקע כללי */
      --chat-bg: #ffffff;             /* צבע רקע חלון השיחה */
      --bot-bubble: #eef2ff;          /* צבע בועת התשובה של הבוט */
      --text-dark: #1e293b;           /* צבע טקסט כהה */
    }

    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0; background: var(--bg-color); display: flex;
      justify-content: center; align-items: center; height: 100vh;
    }
    .chat-container {
      width: 100%; max-width: 480px; height: 92vh; max-height: 720px;
      background: var(--chat-bg); border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .chat-header {
      background: var(--primary-color); color: white; padding: 16px 20px;
      display: flex; align-items: center; gap: 12px;
    }
    .avatar {
      width: 44px; height: 44px; border-radius: 50%; object-fit: cover;
      background: white; border: 2px solid rgba(255,255,255,0.8);
    }
    .header-info h1 { margin: 0; font-size: 17px; }
    .header-info p { margin: 2px 0 0; font-size: 12px; opacity: 0.85; }
    .messages {
      flex: 1; padding: 20px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 12px;
    }
    .msg {
      max-width: 82%; padding: 12px 16px; border-radius: 16px;
      line-height: 1.5; font-size: 15px; white-space: pre-wrap;
    }
    .msg.bot {
      background: var(--bot-bubble); color: var(--text-dark);
      align-self: flex-start; border-bottom-right-radius: 4px;
    }
    .msg.user {
      background: var(--primary-color); color: white;
      align-self: flex-end; border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 12px; border-top: 1px solid #e2e8f0;
      display: flex; gap: 8px; background: white;
    }
    input {
      flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1;
      border-radius: 24px; font-size: 15px; outline: none;
    }
    input:focus { border-color: var(--primary-color); }
    button {
      background: var(--primary-color); color: white; border: none;
      padding: 0 20px; border-radius: 24px; font-weight: 600;
      cursor: pointer; font-size: 15px;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <!-- כאן אפשר להחליף את כתובת התמונה לקישור לתמונת האווטאר שלך -->
    <img id="botAvatar" class="avatar" src="https://api.dicebear.com/9.x/bottts-neutral/svg?seed=Doti" alt="Avatar" />
    <div class="header-info">
      <h1 id="botName">העוזרת הדיגיטלית</h1>
      <p id="botSubtitle">זמינה לשאלות</p>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <form class="input-area" id="chatForm">
    <input type="text" id="userInput" placeholder="כתבי כאן הודעה..." autocomplete="off" required />
    <button type="submit" id="sendBtn">שליחה</button>
  </form>
</div>

<script>
  // הודעת הפתיחה שתופיע מיד כשהמשתמש נכנס לצ'אט
  const WELCOME_MESSAGE = "היי! איך אפשר לעזור לך היום?";

  const messagesDiv = document.getElementById('messages');
  const chatForm = document.getElementById('chatForm');
  const userInput = document.getElementById('userInput');
  const sendBtn = document.getElementById('sendBtn');
  let conversationHistory = [];

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = `msg ${sender}`;
    div.textContent = text;
    messagesDiv.appendChild(div);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    return div;
  }

  // הצגת הודעת פתיחה
  addMessage(WELCOME_MESSAGE, 'bot');

  chatForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = userInput.value.trim();
    if (!text) return;

    addMessage(text, 'user');
    userInput.value = '';
    sendBtn.disabled = true;

    conversationHistory.push({ role: 'user', parts: [{ text }] });
    const loadingMsg = addMessage('מקלידה...', 'bot');

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: conversationHistory })
      });
      const data = await response.json();
      loadingMsg.textContent = data.reply;
      conversationHistory.push({ role: 'model', parts: [{ text: data.reply }] });
    } catch (err) {
      loadingMsg.textContent = 'אופס, הייתה תקלה זמנית. נסי שוב.';
    } finally {
      sendBtn.disabled = false;
      userInput.focus();
    }
  });
</script>

</body>
</html>
